backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "data"
    label: "网站数据管理"
    files:
      - name: "site_data"
        label: "网站数据"
        file: "data.json"
        description: "管理页面所有数据内容"
        fields:
          # ========== 基础设置 ==========
          - label: "统计周期"
            name: "period"
            widget: "string"
            hint: "例如：2026-03-01 至 2026-04-01"

          - label: "站点Logo跳转链接"
            name: "siteLink"
            widget: "string"
            required: false
            hint: "点击页面顶部Logo时跳转的外部链接，不填则不跳转"

          # ========== 今日推荐 ==========
          - label: "推荐列表"
            name: "recommendations"
            widget: "list"
            summary: "{{icon}} {{name}} → {{prediction}}"
            fields:
              - label: "图标"
                name: "icon"
                widget: "string"
                default: "⭐"
                hint: "输入emoji，例如：🔥 ⭐ ⚽ 🏆"

              - label: "比赛名称"
                name: "name"
                widget: "string"
                hint: "例如：023纽约城VS迈阿密国际"

              - label: "预测结果"
                name: "prediction"
                widget: "string"
                hint: "例如：3+4 或 2+3"

              - label: "跳转链接（可选）"
                name: "link"
                widget: "string"
                required: false
                hint: "点击该推荐卡片时跳转的外部链接，不填则不可点击"

          # ========== 比赛记录 ==========
          - label: "比赛记录列表"
            name: "records"
            widget: "list"
            summary: "{{date}} {{league}} {{teams}} → {{result}}"
            fields:
              - label: "日期"
                name: "date"
                widget: "string"
                hint: "例如：03-22"

              - label: "联赛"
                name: "league"
                widget: "string"
                hint: "例如：英超、西甲、意甲、德甲（热门联赛按此字段自动分组）"

              - label: "比赛双方"
                name: "teams"
                widget: "string"
                hint: "例如：曼城 vs 阿森纳"

              - label: "比分"
                name: "score"
                widget: "string"
                hint: "已结束填比分如 2-1，未开始填 未开始"

              - label: "进球预测"
                name: "goals"
                widget: "string"
                hint: "例如：3 或 1+2"

              - label: "结果"
                name: "result"
                widget: "select"
                options:
                  - label: "✅ 命中（胜）"
                    value: "胜"
                  - label: "❌ 未中（负）"
                    value: "负"
                  - label: "⏳ 待定"
                    value: "待中"
                  - label: "➖ 平"
                    value: "平"

              - label: "跳转链接（可选）"
                name: "link"
                widget: "string"
                required: false
                hint: "点击该行时跳转的外部链接，不填则不可点击"
