<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乔乔竞彩总进球</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS VARIABLES - DARK ===== */
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-alt: #1a1a26;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.1);
            --gold: #f0c040;
            --gold-dim: rgba(240, 192, 64, 0.15);
            --green: #34d399;
            --green-dim: rgba(52, 211, 153, 0.12);
            --red: #f87171;
            --red-dim: rgba(248, 113, 113, 0.12);
            --orange: #fb923c;
            --orange-dim: rgba(251, 146, 60, 0.12);
            --text: #e8e6e3;
            --text-muted: #8a8a9a;
            --text-dim: #55556a;
            --accent: #7c6ef0;
            --accent-dim: rgba(124, 110, 240, 0.12);
            --hero-grad: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
            --badge-grad: linear-gradient(135deg, var(--gold), #e6a817);
            --badge-color: #000;
            --table-header-bg: var(--surface-alt);
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            --glow-1: rgba(124, 110, 240, 0.08);
            --glow-2: rgba(240, 192, 64, 0.05);
            --glow-3: rgba(52, 211, 153, 0.03);
            --toggle-bg: var(--surface-alt);
            --noise-opacity: 0.03;
        }

        /* ===== CSS VARIABLES - LIGHT ===== */
        [data-theme="light"] {
            --bg: #f4f1ec;
            --surface: #ffffff;
            --surface-alt: #faf8f5;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.14);
            --gold: #c8951a;
            --gold-dim: rgba(200, 149, 26, 0.1);
            --green: #059669;
            --green-dim: rgba(5, 150, 105, 0.1);
            --red: #dc2626;
            --red-dim: rgba(220, 38, 38, 0.08);
            --orange: #ea580c;
            --orange-dim: rgba(234, 88, 12, 0.1);
            --text: #1a1a2e;
            --text-muted: #64648a;
            --text-dim: #9a9ab0;
            --accent: #6c5ce7;
            --accent-dim: rgba(108, 92, 231, 0.1);
            --hero-grad: linear-gradient(135deg, #000 30%, var(--gold) 100%);
            --badge-grad: linear-gradient(135deg, var(--gold), #b8860b);
            --badge-color: #fff;
            --table-header-bg: #f0ede8;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --glow-1: rgba(108, 92, 231, 0.06);
            --glow-2: rgba(200, 149, 26, 0.04);
            --glow-3: rgba(5, 150, 105, 0.02);
            --toggle-bg: #e8e4de;
            --noise-opacity: 0.015;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.4s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(ellipse at 20% 0%, var(--glow-1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, var(--glow-2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, var(--glow-3) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
            transition: background 0.5s ease;
        }

        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0;
            opacity: var(--noise-opacity);
        }

        .wrapper {
            position: relative; z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 100;
            width: 48px; height: 48px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--toggle-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover { transform: scale(1.08); border-color: var(--border-hover); }
        .theme-toggle:active { transform: scale(0.95); }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0); }
        .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }

        [data-theme="light"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
        [data-theme="light"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0); }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 48px 20px 40px;
        }

        .hero-logo {
            width: 100px; height: 100px;
            border-radius: 24px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px var(--border);
            opacity: 0;
            animation: scaleIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
            transition: transform 0.3s ease;
        }

        .hero-logo:hover { transform: scale(1.05) rotate(2deg); }

        .hero h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: var(--hero-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.2s forwards;
        }

        .hero-sub {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.3s forwards;
        }

        .meta-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.4s forwards;
        }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .meta-chip .label { color: var(--text-dim); font-size: 11px; }
        .meta-chip .value { font-family: 'DM Mono', monospace; color: var(--text); font-size: 12px; }

        /* ===== LIVE CLOCK ===== */
        .live-clock {
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.5s forwards;
        }

        .clock-dot {
            width: 7px; height: 7px;
            background: var(--green);
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
            box-shadow: 0 0 8px var(--green);
        }

        .clock-label { font-size: 11px; color: var(--text-dim); font-weight: 500; }
        .clock-time { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--green); font-weight: 500; letter-spacing: 0.5px; }
        .clock-separator { color: var(--text-dim); font-size: 11px; }
        .clock-date { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); }

        /* ===== SECTIONS ===== */
        .section {
            margin-top: 32px;
            opacity: 0;
            animation: fadeUp 0.7s ease forwards;
        }

        .section:nth-child(2) { animation-delay: 0.5s; }
        .section:nth-child(3) { animation-delay: 0.65s; }
        .section:nth-child(4) { animation-delay: 0.8s; }
        .section:nth-child(5) { animation-delay: 0.95s; }
        .section:nth-child(6) { animation-delay: 1.1s; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .section-icon {
            width: 32px; height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 16px;
            flex-shrink: 0;
        }

        .section-icon.gold { background: var(--gold-dim); }
        .section-icon.green { background: var(--green-dim); }
        .section-icon.red { background: var(--red-dim); }
        .section-icon.accent { background: var(--accent-dim); }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.3px;
        }

        .section-title .sub {
            font-weight: 400;
            color: var(--text-dim);
            font-size: 12px;
            margin-left: 8px;
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 12px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 2px;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:nth-child(1)::before { background: var(--gold); }
        .stat-card:nth-child(2)::before { background: var(--accent); }
        .stat-card:nth-child(3)::before { background: var(--green); }
        .stat-card:nth-child(4)::before { background: var(--orange); }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow);
        }

        .stat-card:hover::before { opacity: 1; }

        .stat-value {
            font-family: 'DM Mono', monospace;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-card:nth-child(1) .stat-value { color: var(--gold); }
        .stat-card:nth-child(2) .stat-value { color: var(--accent); }
        .stat-card:nth-child(3) .stat-value { color: var(--green); }
        .stat-card:nth-child(4) .stat-value { color: var(--orange); }

        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ===== LEAGUES ===== */
        .league-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .league-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            transition: all 0.3s ease;
        }

        .league-item:hover {
            border-color: var(--border-hover);
            background: var(--surface-alt);
        }

        .league-name { font-size: 13px; font-weight: 600; color: var(--text); }

        .league-count {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 3px 10px;
            border-radius: 100px;
            font-weight: 500;
        }

        /* ===== RECOMMENDATIONS ===== */
        .rec-list { display: flex; flex-direction: column; gap: 10px; }

        .rec-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            position: relative;
            overflow: hidden;
        }

        .rec-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 3px 0 0 3px;
            background: linear-gradient(180deg, var(--gold), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .rec-item:hover {
            transform: translateX(4px);
            border-color: var(--border-hover);
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .rec-item:hover::before { opacity: 1; }

        .rec-icon {
            font-size: 22px;
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-alt);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .rec-info { flex: 1; min-width: 0; }

        .rec-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rec-badge {
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            background: var(--badge-grad);
            color: var(--badge-color);
            padding: 6px 16px;
            border-radius: 100px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        /* ===== RECORDS TABLE ===== */
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .record-table {
            width: 100%;
            min-width: 520px;
            border-collapse: collapse;
            font-size: 13px;
        }

        .record-table thead th {
            background: var(--table-header-bg);
            padding: 14px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            transition: background 0.4s ease;
            white-space: nowrap;
        }

        .record-table tbody td {
            padding: 14px 12px;
            text-align: center;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .record-table tbody tr:last-child td { border-bottom: none; }
        .record-table tbody tr:hover td { background: rgba(128,128,128,0.03); }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 100px;
            letter-spacing: 0.3px;
        }

        .badge-win { color: var(--green); background: var(--green-dim); }
        .badge-lose { color: var(--red); background: var(--red-dim); }
        .badge-pending { color: var(--orange); background: var(--orange-dim); }
        .badge-draw { color: var(--text-muted); background: rgba(128,128,128,0.08); }

        /* ===== TIP ===== */
        .tip-card {
            background: var(--surface);
            border: 1px solid rgba(248,113,113,0.15);
            border-radius: 16px;
            padding: 20px 22px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            transition: border-color 0.4s ease;
        }

        [data-theme="light"] .tip-card { border-color: rgba(220,38,38,0.15); }

        .tip-icon {
            font-size: 20px;
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--red-dim);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .tip-text { font-size: 13px; color: var(--text-muted); line-height: 1.8; }
        .tip-text strong { color: var(--red); font-weight: 600; }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 24px;
            font-size: 12px;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
        }

        .footer span { color: var(--red); }

        /* ===== TABLE SCROLL HINT ===== */
        .scroll-hint {
            display: none;
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: var(--text-dim);
            background: var(--surface-alt);
            border-top: 1px solid var(--border);
        }

        .scroll-hint::before {
            content: '← 横向滑动查看完整表格 →';
        }

        /* ============================================================
           RESPONSIVE - TABLET (768px ~ 641px)
           ============================================================ */
        @media (max-width: 768px) and (min-width: 641px) {
            .wrapper { padding: 20px 24px 50px; }
            .hero h1 { font-size: 28px; }
            .stat-value { font-size: 26px; }
        }

        /* ============================================================
           RESPONSIVE - PHONE (640px ~ 361px)
           ============================================================ */
        @media (max-width: 640px) {
            .wrapper { padding: 16px 12px 40px; }

            .hero { padding: 36px 12px 30px; }
            .hero h1 { font-size: 24px; }
            .hero-logo { width: 80px; height: 80px; border-radius: 20px; }
            .hero-sub { font-size: 12px; }

            .meta-row { gap: 8px; }
            .meta-chip { padding: 5px 10px; font-size: 11px; }

            .live-clock { gap: 5px; font-size: 11px; }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-card { padding: 16px 10px; border-radius: 14px; }
            .stat-value { font-size: 22px; }
            .stat-label { font-size: 10px; }

            .league-grid { grid-template-columns: 1fr; gap: 8px; }
            .league-item { padding: 12px 14px; }

            .rec-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 14px 16px;
            }

            .rec-badge { align-self: flex-start; }

            .record-table { min-width: 480px; font-size: 12px; }
            .record-table thead th,
            .record-table tbody td { padding: 10px 8px; }

            .scroll-hint { display: block; }

            .section { margin-top: 24px; }
            .section-title { font-size: 14px; }
            .section-title .sub { display: none; }

            .theme-toggle {
                width: 40px; height: 40px;
                top: 12px; right: 12px;
                font-size: 18px;
                border-radius: 12px;
            }

            .tip-card { padding: 16px 14px; gap: 10px; border-radius: 14px; }
            .tip-icon { width: 34px; height: 34px; font-size: 16px; }
            .tip-text { font-size: 12px; }
        }

        /* ============================================================
           RESPONSIVE - SMALL PHONE (360px and below)
           ============================================================ */
        @media (max-width: 360px) {
            .wrapper { padding: 12px 8px 32px; }

            .hero { padding: 28px 8px 24px; }
            .hero h1 { font-size: 20px; }
            .hero-logo { width: 68px; height: 68px; border-radius: 16px; }

            .meta-row { flex-direction: column; align-items: center; gap: 6px; }
            .meta-chip { font-size: 10px; padding: 4px 8px; }

            .stats-grid { gap: 8px; }
            .stat-card { padding: 12px 6px; border-radius: 12px; }
            .stat-value { font-size: 18px; margin-bottom: 6px; }
            .stat-label { font-size: 9px; }

            .section-header { margin-bottom: 10px; }
            .section-icon { width: 28px; height: 28px; font-size: 14px; }
            .section-title { font-size: 13px; }

            .rec-icon { width: 34px; height: 34px; font-size: 18px; }
            .rec-name { font-size: 13px; }
            .rec-badge { font-size: 12px; padding: 5px 12px; }

            .record-table { min-width: 440px; font-size: 11px; }
            .record-table thead th,
            .record-table tbody td { padding: 8px 6px; }

            .theme-toggle {
                width: 36px; height: 36px;
                top: 10px; right: 10px;
                font-size: 16px;
                border-radius: 10px;
            }
        }

        /* ============================================================
           RESPONSIVE - LANDSCAPE PHONE
           ============================================================ */
        @media (max-height: 500px) and (orientation: landscape) {
            .hero { padding: 20px 12px; }
            .hero-logo { width: 50px; height: 50px; border-radius: 14px; margin-bottom: 10px; }
            .hero h1 { font-size: 20px; margin-bottom: 4px; }
            .hero-sub { font-size: 11px; }
            .meta-row { margin-top: 10px; }
            .live-clock { margin-top: 8px; }
            .section { margin-top: 20px; }
            .stat-card { padding: 12px 8px; }
            .stat-value { font-size: 20px; }
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="切换主题">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
    </button>

    <div class="wrapper">
        <div class="hero">
            <img src="/二维码.jpg" alt="乔乔竞彩" class="hero-logo">
            <h1>乔乔竞彩总进球</h1>
            <div class="hero-sub">专业赛事数据分析 · 总进球预测</div>
            <div class="meta-row">
                <div class="meta-chip">
                    <span class="label">统计周期</span>
                    <span class="value" id="period">--</span>
                </div>
                <div class="meta-chip">
                    <span class="label">总场次</span>
                    <span class="value" id="totalMatches">--</span>
                </div>
            </div>
            <div class="live-clock">
                <div class="clock-dot"></div>
                <span class="clock-label">已同步</span>
                <span class="clock-time" id="clockTime">--:--:--</span>
                <span class="clock-separator">|</span>
                <span class="clock-date" id="clockDate">----/--/--</span>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-icon gold">📊</div>
                <div class="section-title">胜率统计</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="winRate">--</div><div class="stat-label">胜率</div></div>
                <div class="stat-card"><div class="stat-value" id="totalPredict">--</div><div class="stat-label">预测场次</div></div>
                <div class="stat-card"><div class="stat-value" id="winCount">--</div><div class="stat-label">命中</div></div>
                <div class="stat-card"><div class="stat-value" id="streak">--</div><div class="stat-label">当前连红</div></div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-icon accent">🏆</div>
                <div class="section-title">热门联赛</div>
            </div>
            <div class="league-grid" id="leagueList">
                <div class="league-item"><span class="league-name">🏴󠁧󠁥󠁥󠁮󠁧󠁿 英超</span><span class="league-count">12 场</span></div>
                <div class="league-item"><span class="league-name">🇪🇸 西甲</span><span class="league-count">10 场</span></div>
                <div class="league-item"><span class="league-name">🇮🇹 意甲</span><span class="league-count">8 场</span></div>
                <div class="league-item"><span class="league-name">🇩🇪 德甲</span><span class="league-count">6 场</span></div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-icon gold">🔥</div>
                <div class="section-title">今日推荐<span class="sub">精选赛事</span></div>
            </div>
            <div class="rec-list" id="recommendList">
                <div class="rec-item">
                    <div class="rec-icon">⏳</div>
                    <div class="rec-info"><div class="rec-name">数据加载中...</div></div>
                    <span class="rec-badge">--</span>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-icon green">📋</div>
                <div class="section-title">比赛记录</div>
            </div>
            <div class="table-wrap">
                <div class="table-scroll">
                    <table class="record-table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>联赛</th>
                                <th>比赛双方</th>
                                <th>比分</th>
                                <th>进球</th>
                                <th>结果</th>
                            </tr>
                        </thead>
                        <tbody id="recordBody">
                            <tr><td colspan="6" style="color:var(--text-dim);padding:30px">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="scroll-hint"></div>
            </div>
        </div>

        <div class="section">
            <div class="tip-card">
                <div class="tip-icon">💡</div>
                <div class="tip-text"><strong>温馨提示：</strong>比赛难测，预测多是概率游戏。理性看待，娱乐为主，切勿上头！</div>
            </div>
        </div>

        <div class="footer">© 2024 乔乔竞彩 · 仅供娱乐参考 <span>❤️</span></div>
    </div>

    <script>
        // Theme toggle
        function toggleTheme() {
            var html = document.documentElement;
            var next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
        (function() {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        })();

        // Live clock
        function updateClock() {
            var now = new Date();
            var h = String(now.getHours()).padStart(2, '0');
            var m = String(now.getMinutes()).padStart(2, '0');
            var s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockTime').textContent = h + ':' + m + ':' + s;
            var y = now.getFullYear();
            var mo = String(now.getMonth() + 1).padStart(2, '0');
            var d = String(now.getDate()).padStart(2, '0');
            var w = ['日','一','二','三','四','五','六'][now.getDay()];
            document.getElementById('clockDate').textContent = y + '/' + mo + '/' + d + ' 周' + w;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Load data
        function loadData() {
            fetch('/data.json')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    document.getElementById('period').textContent = data.period || '--';
                    if (data.records) document.getElementById('totalMatches').textContent = data.records.length;
                    if (data.stats) {
                        animateValue('winRate', 0, parseInt(data.stats.winRate), 1200, '%');
                        animateValue('totalPredict', 0, data.stats.totalPredict, 1200);
                        animateValue('winCount', 0, data.stats.winCount, 1200);
                        animateValue('streak', 0, data.stats.streak, 800);
                    }
                    if (data.recommendations && data.recommendations.length > 0) {
                        document.getElementById('recommendList').innerHTML = data.recommendations.map(function(item, i) {
                            return '<div class="rec-item" style="animation:fadeUp 0.5s ease ' + (0.1*i) + 's both">' +
                                '<div class="rec-icon">' + item.icon + '</div>' +
                                '<div class="rec-info"><div class="rec-name">' + item.name + '</div></div>' +
                                '<span class="rec-badge">' + item.prediction + '</span></div>';
                        }).join('');
                    }
                    if (data.records && data.records.length > 0) {
                        document.getElementById('recordBody').innerHTML = data.records.map(function(r) {
                            var bc = r.result === '胜' ? 'badge-win' : r.result === '负' ? 'badge-lose' : r.result === '待中' ? 'badge-pending' : 'badge-draw';
                            var sc = r.score === '未开始' ? '<span class="badge badge-pending">⏳ 未开始</span>' : r.score;
                            return '<tr><td>' + r.date + '</td><td>' + r.league + '</td>' +
                                '<td style="text-align:left;font-weight:500;color:var(--text)">' + r.teams + '</td>' +
                                '<td>' + sc + '</td><td style="font-family:DM Mono,monospace;font-weight:600">' + r.goals + '</td>' +
                                '<td><span class="badge ' + bc + '">' + r.result + '</span></td></tr>';
                        }).join('');
                    }
                })
                .catch(function() {
                    document.getElementById('recommendList').innerHTML =
                        '<div class="rec-item"><div class="rec-icon">⚠️</div>' +
                        '<div class="rec-info"><div class="rec-name">数据加载失败</div></div></div>';
                });
        }
        loadData();

        function animateValue(id, start, end, dur, suf) {
            suf = suf || '';
            var el = document.getElementById(id), t0 = null;
            function step(ts) {
                if (!t0) t0 = ts;
                var p = Math.min((ts - t0) / dur, 1);
                el.textContent = Math.floor((1 - Math.pow(1 - p, 3)) * (end - start) + start) + suf;
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", function(u) {
                if (!u) {
                    var h = window.location.hash;
                    if (h && (h.includes('invite_token') || h.includes('confirmation_token') || h.includes('recovery_token'))) {
                        window.netlifyIdentity.open();
                    }
                }
            });
            window.netlifyIdentity.on("login", function() { document.location.href = "/admin/"; });
        }
    </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>
</html>
